<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Defenda Valen sem rede</title>
		<style>
html {
	background-color: #000000;
	color: #ffffff;
}

body {
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
	margin: 2rem;
}

p {
	margin-block: 1rem;
}

button {
	display: block;
	padding: 1rem 2rem;
	margin: 3rem auto 0;
}
		</style>
	</head>
	<body>
		<h1>Faltou alguma coisa guardada</h1>
		<p>O jogo nao precisa de internet, mas precisa estar inteiro guardado neste aparelho. Alguma parte saiu do armazenamento. Abra uma vez com o servidor no ar para guardar de novo.</p>
		<p>Tentar de novo:</p>
		<button type="button">Recarregar</button>
		<script>
document.querySelector('button').addEventListener('click', () => {
	window.location.reload();
});
		</script>
	
		<pre id="valen-diagnostico" style="white-space:pre-wrap;font-size:13px;color:#9fb4c7"></pre>
		<script>
(async () => {
	const saida = document.getElementById('valen-diagnostico')
	const diz = (t) => { saida.textContent += t + '\n' }
	try {
		const nomes = await caches.keys()
		if (!nomes.length) { diz('nenhum cache guardado neste aparelho'); return }
		const cache = await caches.open(nomes[0])
		const guardados = await cache.keys()
		diz('cache: ' + guardados.length + ' arquivos guardados')
		const sw = await cache.match('index.service.worker.js')
		if (sw) {
			const texto = await sw.text()
			const lista = JSON.parse(texto.match(/const CACHED_FILES = (\[[^\]]*\]);/)[1])
			const faltam = []
			for (const nome of lista) if (!(await cache.match(nome))) faltam.push(nome)
			diz('faltando: ' + faltam.length)
			for (const nome of faltam.slice(0, 8)) diz('   ' + nome)
		}
		if (navigator.storage && navigator.storage.estimate) {
			const e = await navigator.storage.estimate()
			diz('espaco usado: ' + (e.usage / 1048576).toFixed(1) + ' MB de ' +
				(e.quota / 1048576).toFixed(0) + ' MB permitidos')
		}
	} catch (e) {
		diz('erro ao medir: ' + (e && e.message || e))
	}
})()
		</script>
	</body>
</html>
